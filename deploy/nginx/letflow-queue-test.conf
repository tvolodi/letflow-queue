# nginx vhost — queue-test.ai-dala.com
# Install: sudo cp this file /etc/nginx/sites-available/letflow-queue-test.conf
#          sudo ln -s /etc/nginx/sites-available/letflow-queue-test.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTP → HTTPS redirect is handled at Cloudflare edge (always_use_https rule).
# This vhost handles only HTTPS traffic arriving from Cloudflare.
#
# JSON API only — no WebSocket upgrade headers or caching rules needed.

server {
    listen 443 ssl;
    server_name queue-test.ai-dala.com;

    # Cloudflare origin certificate — shared wildcard for *.ai-dala.com
    ssl_certificate     /etc/ssl/cloudflare/ai-dala.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai-dala.key;

    location / {
        proxy_pass         http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
